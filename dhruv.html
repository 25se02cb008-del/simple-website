<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dhruv</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      color: #60a5fa;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      color: #60a5fa;
    }

    .hero {
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
    }

    .hero h2 {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: white;
      color: #3b82f6;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn:hover {
      background: #e5e7eb;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111827;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>Dhruv</h1>

    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <div>
      <h2>Hello, I'm Dhruv 👋</h2>
      <p>Welcome to my simple website.</p>
      <a href="#about" class="btn">Learn More</a>
    </div>
  </section>

  <section id="about" style="padding: 60px; text-align: center;">
    <h2>About Me</h2>
    <p style="margin-top: 15px;">
      Hi! My name is Dhruv. This is my personal website.
    </p>
  </section>

  <section id="contact" style="padding: 60px; text-align: center;">
    <h2>Contact</h2>
    <p style="margin-top: 15px;">
      You can contact me here.
    </p>
  </section>

  <footer>
    <p>© 2026 Dhruv. All rights reserved.</p>
  </footer>

</body>
</html>
